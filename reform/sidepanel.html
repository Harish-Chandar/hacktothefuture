<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reform</title>
    <link rel="stylesheet" href="sidepanel.css">
    <script type="module" src="sidepanel.js"></script>
</head>

<body>
    <header class="top">
        <img src="icon.png" alt="" width="24" height="24">
        <h1>Reform</h1>
    </header>

    <p id="unsupported" class="note" hidden>Open a regular website (http or https) to reformat it. Browser pages like this one can't be changed.</p>

    <form id="reform-form" novalidate>
        <fieldset>
            <legend>What should change?</legend>
            <div id="requirements"></div>
        </fieldset>

        <div class="field compact-field">
            <label for="layout">Layout</label>
            <select id="layout">
                <option value="original">Original Layout</option>
                <option value="focused">Focused Layout</option>
                <option value="kid-friendly">Kid-Friendly Layout</option>
                <option value="pure-text">Pure Text</option>
            </select>
        </div>

        <div class="field compact-field">
            <label for="color-vision">Color vision support</label>
            <select id="color-vision">
                <option value="none">Default (no color vision adjustments)</option>
                <option value="protan">Red deficiency (Protan)</option>
                <option value="deutan">Green deficiency (Deutan)</option>
                <option value="tritan">Blue-yellow deficiency (Tritan)</option>
                <option value="achromatopsia">Little or no color perception (Achromatopsia)</option>
            </select>
        </div>

        <div class="field">
            <div class="field-head">
                <label for="other">Tell the AI what else you need</label>
                <button type="button" id="mic" class="mic" aria-pressed="false">
                    <svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-2.07A7 7 0 0 0 19 12h-2Z"/></svg>
                    <span id="mic-label">Speak</span>
                </button>
            </div>
            <textarea id="other" rows="3" placeholder="Type, or click Speak and say what you need"></textarea>
            <p id="mic-status" class="mic-status" role="status" aria-live="polite"></p>
        </div>

        <fieldset class="output">
            <legend>Show the result</legend>
            <label class="radio"><input type="radio" name="output" value="in-place"> This tab</label>
            <label class="radio"><input type="radio" name="output" value="new-tab"> New tab</label>
        </fieldset>

        <p id="form-error" class="form-error" role="alert" hidden></p>
        <button type="submit" id="submit" class="primary post-action">Reformat page</button>
        <button type="button" id="summarize" class="secondary post-action">Summarize page</button>
    </form>

    <section id="summary-pane" class="summary-pane" aria-labelledby="summary-title" hidden>
        <button type="button" id="summary-back" class="back-button">Back to reformat</button>
        <p class="summary-kicker">Accessible page summary</p>
        <h2 id="summary-title"></h2>
        <div id="summary-content" class="summary-content"></div>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <button type="button" id="restore" class="secondary" hidden>Restore original page</button>
    <div id="api-error" class="api-error" role="alert" aria-live="assertive" hidden></div>
</body>

</html>
