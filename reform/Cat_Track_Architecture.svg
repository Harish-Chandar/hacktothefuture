<text x="790" y="1332" font-family="Arial, sans-serif" font-size="16" fill="#18283d" font-weight="normal" text-anchor="middle">Validated outcomes feed back into event history and its search index</text>
<text x="55" y="1393" font-family="Arial, sans-serif" font-size="17" fill="#18283d" font-weight="bold" text-anchor="start">SOURCE OF TRUTH</text>
<text x="55" y="1422" font-family="Arial, sans-serif" font-size="18" fill="#18283d" font-weight="normal" text-anchor="start">Canonical records and original evidence are retained. The search index retrieves their IDs; it does not replace them.</text>
<text x="55" y="1460" font-family="Arial, sans-serif" font-size="17" fill="#18283d" font-weight="normal" text-anchor="start">Prototype: simulated telemetry + text/CSV ingestion. “Learning” means updated persistent history, not model retraining.</text>
<text x="55" y="1493" font-family="Arial, sans-serif" font-size="17" fill="#18283d" font-weight="normal" text-anchor="start">You: own the scenario, dataset, verification, integration checkpoints, and demonstration.</text>
