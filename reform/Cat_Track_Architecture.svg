<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1530" viewBox="0 0 1700 1530">
<title>Cat Track full system architecture</title>
<desc>Sources are converted into persistent events and searchable memories. Queries retrieve original evidence for grounded answers. Human outcomes update the same persistent history.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526176"/></marker></defs><rect width="1700" height="1530" fill="#fff"/>
