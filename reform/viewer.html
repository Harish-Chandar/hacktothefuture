<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Reformatted page</title>
    <link rel="stylesheet" href="viewer.css">
    <script type="module" src="viewer.js"></script>
</head>

<body>
    <header class="bar">
        <img src="icon.png" alt="" width="24" height="24">
        <p class="bar-title">Reformatted by <strong>Reform</strong></p>
        <details id="changes" class="changes" hidden>
            <summary>What changed</summary>
            <ul id="changes-list"></ul>
        </details>
        <a id="original" class="original" target="_blank" rel="noopener">View original</a>
    </header>
    <p id="message" class="message" hidden></p>
    <iframe id="frame" title="Reformatted page" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
</body>

</html>
